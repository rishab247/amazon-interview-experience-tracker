<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon Interview Intelligence Hub | LeetCode Discuss Insights</title>
  <meta name="description" content="Explore 1,300+ real Amazon interview experiences, questions, compensation breakdowns, and Leadership Principles insights curated from LeetCode Discuss." />
  
  <!-- Immediate Redirection to UI application -->
  <meta http-equiv="refresh" content="0; url=ui/" />
  <script>
    (function () {
      var target = 'ui/' + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0B0F17;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .brand-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 1.25rem;
      border-radius: 0.875rem;
      background: linear-gradient(135deg, #F59E0B, #EA580C);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 1.75rem;
      font-weight: 900;
      box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.3);
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: #FFFFFF;
      letter-spacing: -0.025em;
    }
    p {
      font-size: 0.875rem;
      color: #94A3B8;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(245, 158, 11, 0.2);
      border-top-color: #F59E0B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      background: #F59E0B;
      color: #0F172A;
      font-weight: 700;
      font-size: 0.875rem;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.2);
    }
    .btn:hover {
      background: #D97706;
      color: #FFFFFF;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-icon">a</div>
    <h1>Amazon Interview Explorer</h1>
    <p>Curating 1,300+ verified interview experiences, real question bank, and Leadership Principles insights.</p>
    <div class="spinner"></div>
    <a class="btn" href="ui/">Launch Explorer &rarr;</a>
  </div>
</body>
</html>
