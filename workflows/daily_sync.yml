name: Daily Amazon Experiences Sync

on:
  schedule:
    # Run daily at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of latest topics to inspect'
        required: false
        default: '50'
        type: string
      dry_run:
        description: 'Run in dry-run mode (do not commit changes or send live alerts)'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync Latest Experiences
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily synchronization script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          LIMIT="${{ inputs.limit || '50' }}"
          python scripts/daily_sync.py --limit "$LIMIT" $EXTRA_ARGS

      - name: Check for dataset changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain data/ ui/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/experiences.json ui/experiences.json
          git commit -m "chore(data): auto-sync latest interview experiences [skip ci]"
          git push origin HEAD:main

      - name: Deploy update to Vercel
        if: steps.git_status.outputs.has_changes == 'true' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel --token "$VERCEL_TOKEN" --prod --yes
